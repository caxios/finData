[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "findata"
version = "0.2.0"
description = "Financial data library for SEC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "sec-cik-mapper",
    "beautifulsoup4",
    "lxml",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
    "playwright",
    "tavily-python",
    "psycopg2-binary",
]
transcripts = [
    "tavily-python",
]
sec-parser = [
    "sec-parser",
]
all = [
    "findata[server,sec-parser]",
]
dev = [
    "pytest",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["findata*"]

[tool.setuptools.package-data]
# Ship non-Python data files inside the wheel (e.g. the data universe config)
# so a non-editable install (Docker image) has them.
"findata.server.ingestion" = ["*.json"]
