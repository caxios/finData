[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "findata"
version = "0.2.0"
description = "Financial data library for SEC and OpenDart"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "sec-cik-mapper",
    "beautifulsoup4",
    "lxml",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
    "playwright",
]
transcripts = [
    "tavily-python",
]
dart = [
    "dart-fss",
    "pandas",
]
sec-parser = [
    "sec-parser",
]
all = [
    "findata[server,transcripts,dart,sec-parser]",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["findata*"]
