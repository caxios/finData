name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (build + test gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (server + dart + dev)
        run: pip install ".[server,dart,dev]"

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t findata:ci .
      # On deploy (main only) you'd push to ECR and roll the service, e.g.:
      #   aws ecr get-login-password | docker login --username AWS --password-stdin <acct>.dkr.ecr.<region>.amazonaws.com
      #   docker tag findata:ci <ecr-repo>:$GITHUB_SHA && docker push <ecr-repo>:$GITHUB_SHA
      #   aws apprunner start-deployment / aws ecs update-service --force-new-deployment
